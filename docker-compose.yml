services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        env_file: .env
        environment:
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/html/database/database.sqlite
        volumes:
            - storage:/var/www/html/storage
            - database:/var/www/html/database
        command: sh -c "php artisan migrate --force && php artisan storage:link --force && php-fpm"

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        env_file: .env
        environment:
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/html/database/database.sqlite
        volumes:
            - storage:/var/www/html/storage
            - database:/var/www/html/database
        command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
        depends_on:
            - app

    nginx:
        build:
            context: .
            dockerfile: Dockerfile
            target: web
        ports:
            - "8080:80"
        depends_on:
            - app

volumes:
    storage:
    database:
