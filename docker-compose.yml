services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        env_file: .env
        environment:
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/html/database/database.sqlite
        volumes:
            - storage:/var/www/html/storage
            - database:/var/www/html/database
        command: sh -c "php artisan migrate --force && php artisan storage:link --force && php-fpm"

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
            target: app
        env_file: .env
        environment:
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/html/database/database.sqlite
        volumes:
            - storage:/var/www/html/storage
            - database:/var/www/html/database
        command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
        depends_on:
            - app

    nginx:
        build:
            context: .
            dockerfile: Dockerfile
            target: web
        ports:
            - "8080:80"
        depends_on:
            - app

    evolution-api:
        image: evoapicloud/evolution-api:v2.3.7
        restart: unless-stopped
        ports:
            - "8081:8080"
        environment:
            AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
            DATABASE_ENABLED: "true"
            DATABASE_PROVIDER: postgresql
            DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public
            CACHE_REDIS_ENABLED: "false"
            CACHE_LOCAL_ENABLED: "true"
        volumes:
            - evolution_instances:/evolution/instances
        depends_on:
            - evolution-db

    evolution-db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: evolution
            POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
            POSTGRES_DB: evolution
        volumes:
            - evolution_db:/var/lib/postgresql/data

volumes:
    storage:
    database:
    evolution_instances:
    evolution_db:
