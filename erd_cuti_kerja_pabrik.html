<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  DEPARTEMEN ||--o{ KARYAWAN : memiliki
  JABATAN ||--o{ KARYAWAN : menempati
  KARYAWAN ||--o{ PENGAJUAN_CUTI : mengajukan
  JENIS_CUTI ||--o{ PENGAJUAN_CUTI : jenis
  KARYAWAN ||--o{ SALDO_CUTI : memiliki
  JENIS_CUTI ||--o{ SALDO_CUTI : untuk
  PENGAJUAN_CUTI ||--o{ APPROVAL : melalui
  KARYAWAN ||--o{ APPROVAL : menyetujui
  KARYAWAN ||--o{ JADWAL_SHIFT : dijadwalkan
  SHIFT ||--o{ JADWAL_SHIFT : digunakan
  KARYAWAN ||--o| USER_AKUN : login

  DEPARTEMEN {
    int id PK
    string nama_departemen
    string kode
  }
  JABATAN {
    int id PK
    string nama_jabatan
  }
  KARYAWAN {
    int id PK
    string nip
    string nama
    string email
    string no_hp
    int departemen_id FK
    int jabatan_id FK
    date tanggal_masuk
    string status
  }
  JENIS_CUTI {
    int id PK
    string nama_jenis
    int kuota_default
    string keterangan
  }
  PENGAJUAN_CUTI {
    int id PK
    int karyawan_id FK
    int jenis_cuti_id FK
    date tanggal_mulai
    date tanggal_selesai
    int jumlah_hari
    string alasan
    string status
    datetime tanggal_pengajuan
    string lampiran
  }
  SALDO_CUTI {
    int id PK
    int karyawan_id FK
    int jenis_cuti_id FK
    int tahun
    int kuota
    int terpakai
    int sisa
  }
  APPROVAL {
    int id PK
    int pengajuan_id FK
    int approver_id FK
    int level
    string status
    datetime tanggal_approval
    string catatan
  }
  SHIFT {
    int id PK
    string nama_shift
    time jam_mulai
    time jam_selesai
  }
  JADWAL_SHIFT {
    int id PK
    int karyawan_id FK
    int shift_id FK
    date tanggal
  }
  USER_AKUN {
    int id PK
    int karyawan_id FK
    string username
    string password_hash
    string role
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
